name: Test PS5 Atlas
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'atlas-sources.json'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint GitHub Actions
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Python 3.12 regression suite
        run: python -m unittest discover -s tests -v
      - name: Python 3.12 metadata validation
        run: python scripts/validate.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Python 3.14 regression suite
        run: python -m unittest discover -s tests -v
      - name: Python 3.14 metadata validation
        run: |
          python scripts/validate.py
          python -O scripts/validate.py
